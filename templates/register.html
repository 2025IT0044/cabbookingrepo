<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - RideGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚕 RideGo
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/login" class="login-btn">Login</a>
        </div>

    </nav>


    <div class="form-container">

        <div class="form-card">

            <h1>Create Account</h1>

            <p>Join RideGo and book your ride easily.</p>

            <form method="POST">

                <label>Full Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter your name"
                       required>


                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <label>Phone Number</label>
                <input type="text"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>


                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Create a password"
                       required>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="form-bottom">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

    <footer class="site-footer">
        <div>
            <strong>🚕 RideGo</strong>
            <p>Simple. Reliable. Ready to ride.</p>
        </div>
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
        <small>© 2026 RideGo. All rights reserved.</small>
    </footer>

</body>
</html>
